method: searched
source: https://doc.toasttab.com/doc/devguide/apiUsingRestApis.html
docs:
- https://doc.toasttab.com/doc/devguide/authentication.html
- https://doc.toasttab.com/doc/devguide/apiResponseDataPagination.html
- https://doc.toasttab.com/doc/devguide/apiResponsesAndErrors.html
- https://doc.toasttab.com/doc/devguide/apiRateLimiting.html
- https://doc.toasttab.com/doc/devguide/apiVoidOrder.html
