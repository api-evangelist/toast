name: Toast Domain Vocabulary
provider: Toast
providerId: toast
description: Tag-derived vocabulary for the Toast API surface; sourced from openapi/ tags.
terms:
- term: Orders
  description: 'Related to orders made by restaurant guests. For example, a restaurant

    guest orders items from a menu. Toast platform orders include one or

    more guest check.'
- term: Payments
  description: 'Related to guests'' payments for restaurant orders. Toast platform

    payments apply to a check in an order.'
- term: Discounts
  description: 'Related to price reduction applied to restaurant orders. For example, a

    restaurant might apply a discount for a promotion.'
