x-components: {}
servers:
- url: https://toast-api-server/era/v1
components:
  securitySchemes:
    oauth2:
      description: "Access to Toast APIs, specific endpoints, \nand specific API endpoint operations is\
        \ \ncontrolled by the scopes that are associated \nwith your API account. \n\nA full reference\
        \ for Toast API scopes and \ntheir capabilities can be found in the\n[_Toast Developer Guide_](https://doc.toasttab.com/doc/devguide/apiScopes.html).\n"
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://toast-api-server/authentication/v1/authentication/login
          scopes:
            enterprise-metrics:read: 'Allows reading from the analytics API.

              '
  schemas:
    MetricsReportingDataRequest:
      description: "Information about what the aggregated sales reporting data covers and how it is presented.\
        \ This includes \nthe starting and ending dates of the time range, the included or excluded restaurants,\
        \ and \naggregation options.\n"
      type: object
      properties:
        startBusinessDate:
          description: 'The starting date of the time range for the reporting data.


            Specify the business day in the format YYYYMMDD. For example, `20220824`.

            '
          format: integer
          type: number
        endBusinessDate:
          description: 'The ending date of the time range for the reporting data.


            Specify the business day in the format YYYYMMDD. For example, `20220824`.

            '
          format: integer
          type: number
        restaurantIds:
          description: "The `restaurantGuid` values of specific restaurants in the management group to\
            \ include in the \nreporting data. If used, only the data for listed restaurants in the management\
            \ group \nthat are identified by `restaurantGuid` is included. If left blank, all restaurants\
            \ are included \nby default.\n"
          items:
            format: uuid
            type: string
          type: array
        excludedRestaurantIds:
          description: "The `restaurantGuid` values of specific restaurants in the management group to\
            \ exclude from the \nreporting data. If used, the data for listed restaurants in the management\
            \ group \nthat are identified by `restaurantGuid` is excluded. If left blank, all restaurants\
            \ are included \nby default.\n"
          items:
            format: UUID
            type: string
          type: array
        groupBy:
          description: 'The way the reporting data results are aggregated. You can use up to two values
            at a time.


            Valid values:


            * `DINING_OPTION` - The reporting data is grouped by dining option.

            * `ORDER_SOURCE` - The reporting data is grouped by order source.

            * `REVENUE_CENTER` - The reporting data is grouped by revenue center.

            '
          items:
            enum:
            - REVENUE_CENTER
            - DINING_OPTION
            - ORDER_SOURCE
            type: string
          type: array
      required:
      - restaurantIds
      - excludedRestaurantIds
      - startBusinessDate
      - endBusinessDate
    MetricsReportingData:
      description: The aggregated sales reporting data.
      type: object
      properties:
        restaurantGuid:
          description: 'The identifier assigned by the Toast platform used to identify a restaurant location.

            '
          format: UUID
          type: string
        businessDate:
          description: "The date for the aggregated reporting data. The business \nday uses the YYYYMMDD\
            \ format. For example, `20220824`.\n"
          format: integer
          type: string
        guestCount:
          description: 'The total number of guests recorded across all orders.

            '
          format: integer
          type: number
        voidOrdersCount:
          description: The total number of orders with at least one voided item.
          format: integer
          type: number
        discountOrderCount:
          description: The total number of orders that have at least one discount.
          format: integer
          type: number
        ordersCount:
          description: 'The total number of orders that were not voided.

            '
          format: integer
          type: number
        openOrderCount:
          description: The total number of open orders.
          format: integer
          type: number
        closedOrderCount:
          description: The total number of closed orders.
          format: integer
          type: number
        netSalesAmount:
          description: "The total sales, excluding tax, gratuity, tips, discounts, refunds, and \ndeferred\
            \ amounts.\n"
          format: double
          type: number
        grossSalesAmount:
          description: The total sales, including discounts and refunds.
          format: double
          type: number
        discountAmount:
          description: The total amount of discounts for orders.
          format: double
          type: number
        voidOrdersAmount:
          description: The total amount of voided items.
          format: double
          type: number
        refundAmount:
          description: The total amount of refunded sales.
          format: double
          type: number
        avgOrderValue:
          description: The average amount for an order.
          format: double
          type: number
        revenueCenter:
          description: "The revenue center for the data. This property only appears when the \nrequest\
            \ for reporting data includes the `groupBy` property with\nvalue `REVENUE_CENTER`.\n"
          type: string
        diningOption:
          description: "The dining option for the data. This property only appears when the \nrequest\
            \ for reporting data includes the `groupBy` property with\nvalue `DINING_OPTION`.\n"
          type: string
        orderSource:
          description: "The method used to place an order, also known as the order source. This property\n\
            only appears when the request for reporting data includes the `groupBy` property \nwith value\
            \ `ORDER_SOURCE`.\n\nValid values:\n* `API`\n* `BRANDED_ONLINE_ORDERING`\n* `CALLER_ID`\n\
            * `CATERING`\n* `CATERING_ONLINE_ORDERING`\n* `GOOGLE`\n* `GRUBHUB` (deprecated)\n* `IN_STORE`\n\
            * `INVOICE`\n* `KIOSK`\n* `ONLINE`\n* `ORDER_AND_PAY_AT_TABLE`\n* `TOAST_LOCAL`\n* `TOAST_PICKUP_APP`\n\
            * `TOAST_TABLES`\n"
        businessHour:
          description: "The hour the data represents. This property only appears when the `aggregateBy`\
            \ \nquery parameter is set to `HOUR` in the `POST` request for creating the reporting\nmetrics\
            \ request. The hour number corresponds to the 24 hours of the day, starting \nat 0 and ending\
            \ at 23.\n"
          format: integer
          type: string
        hourlyJobTotalHours:
          description: 'The total hours worked by employees with hourly jobs. This does not include breaks.

            '
          format: double
          type: string
        hourlyJobTotalPay:
          description: 'The total wages earned by employees with hourly jobs, including overtime pay.
            This does not include tips.

            '
          format: double
          type: string
        hourlyJobSalesPerLaborHour:
          description: 'The average net sales for each hour worked by employees with hourly jobs.

            '
          format: double
          type: string
        restaurantName:
          description: 'The restaurant''s name. This property is only included when

            the `fetchRestaurantNames` parameter is set to `true` in the `GET` request.

            '
          format: string
          type: string
    RestaurantsGuidName:
      description: Information about a restaurant in the management group.
      type: object
      properties:
        restaurantGuid:
          description: 'The identifier assigned by the Toast platform used to identify a restaurant location.

            '
          format: UUID
          type: string
        restaurantName:
          description: The restaurant's name.
          format: string
          type: string
        active:
          description: 'Indicates whether the restaurant is activated or not.


            Valid values:


            * `true` - The restaurant is activated.


            * `false` - The restaurant is deactivated.

            '
          format: boolean
          type: boolean
        testMode:
          description: 'Indicates whether the restaurant is in test mode or not.


            Valid values:


            * `true` - The restaurant is in test mode.


            * `false` - The restaurant is not in test mode.

            '
          format: boolean
          type: boolean
        archived:
          description: 'Indicates whether the restaurant is archived or not.


            Valid values:


            * `true` - The restaurant is archived.


            * `false` - The restaurant is not archived.

            '
          format: boolean
          type: boolean
    CheckReportingDataRequest:
      description: 'Information about what the check reporting data covers and how it is presented. This
        includes

        the starting and ending dates of the time range, and the included or excluded restaurants.

        '
      type: object
      properties:
        startBusinessDate:
          description: 'The starting date of the time range for the reporting data.


            Specify the business day in the format YYYYMMDD. For example, `20220824`.

            '
          format: integer
          type: number
        endBusinessDate:
          description: 'The ending date of the time range for the reporting data.


            Specify the business day in the format YYYYMMDD. For example, `20220824`.

            '
          format: integer
          type: number
        restaurantIds:
          description: "The `restaurantGuid` values of specific restaurants in the management group to\
            \ include in the \nreporting data. If used, only the data for listed restaurants in the management\
            \ group \nthat are identified by `restaurantGuid` is included. If left blank, all restaurants\
            \ are included \nby default.\n"
          items:
            format: uuid
            type: string
          type: array
        excludedRestaurantIds:
          description: "The `restaurantGuid` values of specific restaurants in the management group to\
            \ exclude from the \nreporting data. If used, the data for listed restaurants in the management\
            \ group \nthat are identified by `restaurantGuid` is excluded. If left blank, all restaurants\
            \ are included \nby default.\n"
          items:
            format: UUID
            type: string
          type: array
      required:
      - restaurantIds
      - excludedRestaurantIds
      - startBusinessDate
      - endBusinessDate
    CheckReportingData:
      description: The check reporting data.
      type: object
      properties:
        restaurantGuid:
          description: 'The identifier assigned by the Toast platform used to identify a restaurant location.

            '
          format: UUID
          type: string
        orderNumber:
          description: The number of the order.
          format: long
          type: number
        orderGuid:
          description: The identifier assigned by the Toast platform used to identify an order.
          format: UUID
          type: string
        checkNumber:
          description: The number of the check.
          format: long
          type: number
        checkGuid:
          description: The identifier assigned by the Toast platform used to identify a check.
          format: UUID
          type: string
        orderOpenDate:
          description: "The business date for when the order is initially expected to be fulfilled. The\
            \ business \ndate uses the YYYYMMDD format. For example, `20220824`.\n"
          format: integer
          type: string
        checkPaidDateTime:
          description: The business date and time that the check was paid.
          format: date-time
          type: string
        checkModifiedDateTime:
          description: The business date and time that the check was modified.
          format: date-time
          type: string
        checkStatus:
          description: "The state of the check. \n\nValid values:\n\n* `OPEN` - The check is open and\
            \ unpaid.\n\n* `PAID` - The check is initially paid, but the payment is not finalized.\n\n\
            * `CLOSED` - The check payment is finalized.\n"
          format: text
          type: string
        checkVoidedStatus:
          description: 'Indicates whether the check is void or not.


