openapi: 3.0.0
info:
  title: Analytics API
  description: "The analytics API provides an enterprise reporting and analytics service, \nand includes\
    \ operations that retrieve information for all restaurants, or a\nsubset of restaurants, in a management\
    \ group, create requests for reporting data, \nand retrieve the reporting data.\n\nThe types of reporting\
    \ data include:\n* Aggregated sales reporting data covering sales and labor information.\n* Check\
    \ reporting data providing information for each check.\n* Labor reporting data providing information\
    \ for employees and jobs that are paid hourly.\n* Menu reporting data providing information for menu\
    \ entities as they relate to sales.\n* Payout reporting data providing information for payouts organized\
    \ either by settled date, payments, or sales date.\n* Guest reporting data providing information for\
    \ guest's payment cards organized by payments.\n"
  version: 1.0.0
  contact:
    name: Toast developer support
tags:
- name: Aggregated sales
  description: The analytics API endpoints for aggregated sales reporting data covering sales and labor
    information.
- name: Check
  description: The analytics API endpoints for check reporting data.
- name: Labor
  description: The analytics API endpoints for labor reporting data. This only supports hourly job and
    employee data.
- name: Menu
  description: The analytics API endpoints for menu reporting data.
- name: Payout by settled date
  description: The analytics API endpoint for payout reporting data organized by settled date.
- name: Payout by payments
  description: The analytics API endpoint for payout reporting data organized by payments.
- name: Payout by sales date
  description: The analytics API endpoint for payout reporting data organized by sales date.
- name: Guest
  description: The analytics API endpoint for guest reporting data organized by payment.
- name: Restaurants information
  description: The analytics API endpoint for providing information about restaurants in a management
    group.
paths:
  /metrics:
    post:
      summary: Post an aggregated sales reporting data request for a custom time range
      description: "Creates an aggregated sales reporting data request for a customized time range. \n\
        \nUse the `onlyInactiveRestaurants` query parameter set to `true` to get data for inactive restaurants\
        \ only.\n\nSpecify the `startBusinessDate` and `endBusinessDate` for the data in the message body.\n\
        \nIdentify restaurants to include or exclude with the `restaurantIds` and \n`excludedRestaurantIds`\
        \ properties. If left blank, all restaurants are included by default.\n\nInclude information about\
        \ how to aggregate the data with the `groupBy` property.\n"
      operationId: postMetricsReportingDataCustomTimeRangeRequest
      parameters:
      - name: onlyInactiveRestaurants
        description: 'Specifies whether the data is for inactive restaurants only. Active restaurant data
          is returned by default.


          Valid values:


          * `true` - The data retrieved is for inactive restaurants only.


          * `false` - The data retrieved is for active restaurants only.

          '
        in: query
        required: false
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetricsReportingDataRequest'
        description: "A JSON object containing the starting and ending dates for the aggregated sales\
          \ reporting data \nrequest, included or excluded restaurants, and aggregation options.\n"
        required: true
      responses:
        '200':
          description: The `reportRequestGuid` used to retrieve the data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportRequestGuid'
        '400':
          description: The request contains invalid information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '500':
          description: 'An unexpected internal error occurred. The

            `requestId` attached to this error can be referenced by

            the Toast support team.

            '
      security:
      - oauth2:
        - enterprise-metrics:read
      tags:
      - Aggregated sales
  /metrics/{timeRange}:
    post:
      summary: Post an aggregated sales reporting data request for a specific time range
      description: "Creates an aggregated sales reporting data request for a specific time range.\n\n\
        Specify the time range with the `timeRange` path parameter.\n\nInclude information on how to aggregate\
        \ the data for the `day` time range using the\n`aggregateBy` query parameter.\n\nUse the `onlyInactiveRestaurants`\
        \ query parameter set to `true` to get data for inactive restaurants only.\n\nSpecify the `startBusinessDate`\
        \ and `endBusinessDate` for the data in the message body.\n\nIdentify which restaurants to include\
        \ or exclude with the \n`restaurantIds` and `excludedRestaurantIds` properties. If left blank,\
        \ all restaurants are included by default.\n\nInclude information about how to aggregate the data\
        \ with the `groupBy` property.\n"
      operationId: postMetricsReportingDataSpecificTimeRangeRequest
      parameters:
      - name: timeRange
        description: 'The specific time range that you are requesting the data for.


          Valid values:


          * `day` - The request covers a one day time range. This value can optionally use the `aggregateBy`
          query parameter.


          * `week` - The request covers a time range of seven days or fewer.


          * `month` - The request covers a time range of 31 days or fewer.


          * `year` - The request covers a time range of 366 days or fewer.

          '
        in: path
        required: true
        schema:
          type: string
          enum:
          - day
          - week
          - month
          - year
      - name: aggregateBy
        description: 'Aggregates the data by day or hour if using the `timeRange` value `day`. The data
          is aggregated by day by default.


          Valid values:


          * `DAY` - The reporting data is aggregated by day.


          * `HOUR` - The reporting data is aggregated by hour.

          '
        in: query
        required: false
        schema:
          type: string
          enum:
          - DAY
          - HOUR
      - name: onlyInactiveRestaurants
        description: 'Specifies whether the data is for inactive restaurants only. Active restaurant data
          is returned by default.


          Valid values:


          * `true` - The data retrieved is for inactive restaurants only.


          * `false` - The data retrieved is for active restaurants only.

          '
        in: query
        required: false
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetricsReportingDataRequest'
        description: 'A JSON object containing the starting and ending dates for the aggregated sales
          reporting data

          request, included or excluded restaurants, and aggregation options.

          '
        required: true
      responses:
        '200':
          description: The `reportRequestGuid` used to retrieve the data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportRequestGuid'
        '400':
          description: The request contains invalid information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '500':
          description: 'An unexpected internal error occurred. The

            `requestId` attached to this error can be referenced by

            the Toast support team.

            '
      security:
      - oauth2:
        - enterprise-metrics:read
      tags:
      - Aggregated sales
  /metrics/{reportRequestGuid}:
    get:
      summary: Get the aggregated sales reporting data
      description: "Returns the aggregated sales reporting data for the specified report request GUID.\
        \ \n\nSpecify the `reportRequestGuid` for the data.\n\nSpecify whether to include the guest-facing\
        \ restaurant names.\n"
      operationId: getMetricsReportingData
      parameters:
      - name: reportRequestGuid
        description: The Toast platform identifier for the data request.
        in: path
        required: true
        schema:
          type: string
      - name: fetchRestaurantNames
        description: "Specifies whether the data includes the guest-facing restaurant name. The guest-facing\
          \ \nrestaurant name is not returned by default.\n\nValid values:\n\n* `true` - The guest-facing\
          \ restaurant name is returned with the data.\n\n* `false` - The guest-facing restaurant name\
          \ is not returned with the data.\n"
        in: query
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: The aggregated sales reporting data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsReportingData'
        '202':
          description: The Toast platform is in the process of gathering the reporting data. Try the request
            again at a later time.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportingDataInProgress'
        '404':
          description: An unexpected error occurred. Refer to the `message` attached to this error for
            more information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '409':
          description: The Toast platform was unable to process the request. Request a new `reportRequestGuid`
            and try again.
        '500':
          description: 'An unexpected internal error occurred. The

            `requestId` attached to this error can be referenced by

            the Toast support team.

            '
        '504':
          description: The Toast platform was unable to process the request because internal services
            took too long to process, resulting in a timeout.
      security:
      - oauth2:
        - enterprise-metrics:read
      tags:
      - Aggregated sales
  /metrics/{timeRange}/{reportRequestGuid}:
    get:
      deprecated: true
      summary: Get the aggregated sales reporting data for a specific time range
      description: "This endpoint is deprecated. Instead of `/metrics/{timeRange}/{reportRequestGuid}`,\
        \ use\n`/metrics/{reportRequestGuid}`.\n\nReturns the aggregated sales reporting data for cumulative\
        \ metrics for the specified time range report request GUID. \n\nSpecify the time range with the\
        \ `timeRange` path parameter.\n\nSpecify the `reportRequestGuid` for the data.\n\nSpecify whether\
        \ to include the guest-facing restaurant names.\n"
      operationId: getMetricsReportingDataSpecificTimeRange
      parameters:
      - name: timeRange
        description: 'The specific time range that you are requesting the data for.


          Valid values:


          * `day` - The request covers a one day time range.


          * `week` - The request covers a time range of seven days or fewer.


          * `month` - The request covers a time range of 31 days or fewer.


          * `year` - The request covers a time range of 366 days or fewer.

          '
        in: path
        required: true
        schema:
          type: string
          enum:
          - day
          - week
          - month
          - year
      - name: reportRequestGuid
        description: The Toast platform identifier for the data request.
        in: path
        required: true
        schema:
          type: string
      - name: fetchRestaurantNames
        description: 'Specifies whether the data includes the guest-facing restaurant name. The guest-facing
          restaurant name is not returned by default.


          Valid values:


          * `true` - The guest-facing restaurant name is returned with the data.


          * `false` - The guest-facing restaurant name is not returned with the data.

          '
        in: query
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: The aggregated sales reporting data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsReportingData'
        '202':
          description: The Toast platform is in the process of gathering the reporting data. Try the request
            again at a later time.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportingDataInProgress'
        '404':
          description: An unexpected error occurred. Refer to the `message` attached to this error for
            more information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '409':
          description: The Toast platform was unable to process the request. Request a new `reportRequestGuid`
            and try again.
        '500':
          description: 'An unexpected internal error occurred. The

            `requestId` attached to this error can be referenced by

            the Toast support team.

            '
        '504':
          description: The Toast platform was unable to process the request because internal services
            took too long to process, resulting in a timeout.
      security:
      - oauth2:
        - enterprise-metrics:read
      tags:
      - Aggregated sales
  /restaurants-information:
    get:
      summary: Get management group restaurant information
      description: 'Returns an array of `RestaurantInfo` objects containing the GUID and guest-facing
        name for each

        restaurant in the associated management group, and whether or not the restaurant is activated,
        in test mode, or archived.

        '
      operationId: getManagementGroupRestaurantsInformation
      responses:
        '200':
          description: A JSON array of `RestaurantsGuidName` objects for each restaurant in the management
            group.
          content:
            application/json:
              schema:
                title: Response
                type: array
                items:
                  $ref: '#/components/schemas/RestaurantsGuidName'
      security:
      - oauth2:
        - enterprise-metrics:read
      tags:
      - Restaurants information
