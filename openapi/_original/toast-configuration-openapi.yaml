servers:
- url: https://toast-api-server/config/v2
components:
  securitySchemes:
    oauth2:
      description: "Access to Toast APIs, specific endpoints, \nand specific API endpoint operations is\
        \ \ncontrolled by the scopes that are associated \nwith your API account. \nA full reference for\
        \ Toast API scopes and \ntheir capabilities can be found in the\n[_Toast Developer Guide_](https://doc.toasttab.com/doc/devguide/apiScopes.html).\n"
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://toast-api-server/authentication/v1/authentication/login
          scopes:
            config:read: 'Allows reading from the configuration API.

              '
  schemas:
    AlternatePaymentType:
      type: object
      allOf:
      - $ref: '#/components/schemas/ExternalReference'
      - type: object
        properties:
          name:
            type: string
            description: The name of the alternate payment type.
    BreakType:
      type: object
      allOf:
      - $ref: '#/components/schemas/ToastReference'
      - type: object
        properties:
          name:
            type: string
            description: 'The name of the work break type, as recognized by

              restaurant employees.

              '
          active:
            type: boolean
            description: 'Indicates whether the break is available and can be taken

              by restaurant employees.

              '
          paid:
            type: boolean
            description: Indicates whether the break is paid.
          duration:
            type: integer
            description: The duration of the break in minutes.
          enforceMinimumTime:
            type: boolean
            description: 'Indicates whether the duration is enforced as the minimum

              time for the break.

              '
          trackMissedBreaks:
            type: boolean
            description: 'True if breaks that are not taken within the specified break

              interval should be generated in Toast.

              '
          breakIntervalHrs:
            type: integer
            description: 'The number of hours between break intervals. Break intervals

              are specified in hours and minutes. If missed breaks are not

              tracked, this value may be null.

              '
          breakIntervalMins:
            type: integer
            description: 'The number of minutes between break intervals. Break intervals

              are specified in hours and minutes. If missed breaks are not

              tracked, this value may be null.

              '
          trackBreakAcknowledgement:
            type: boolean
            description: 'Indicates whether break acknowledgements are collected for

              this type of break. Break acknowledgements will not be

              collected if `trackMissedBreaks` is false.

              '
    CashDrawer:
      type: object
      allOf:
      - $ref: '#/components/schemas/ToastReference'
      - type: object
        properties:
          printer:
            $ref: '#/components/schemas/ToastReference'
    DiningOption:
      type: object
      allOf:
      - $ref: '#/components/schemas/ExternalReference'
      - type: object
        properties:
          name:
            type: string
            description: The name of the dining option.
          behavior:
            type: string
            description: 'The behavior of the dining option. `TAKE_OUT` and

              `DELIVERY` require a `customer` to be specified on the

              order, and `DELIVERY` requires a `deliveryInfo` value.

              '
            enum:
            - DINE_IN
            - TAKE_OUT
            - DELIVERY
          curbside:
            type: boolean
            description: 'Indicates whether the dining option has curbside behavior, and allows the guest
              to

              provide identifying information such as a description of their vehicle.

              '
    Discount:
      type: object
      allOf:
      - $ref: '#/components/schemas/ToastReference'
      - type: object
        description: 'A discount configured in Toast Web.

          Discounts are always applied before taxes, but after

          service charges are calculated.

          '
        properties:
          name:
            type: string
            description: The human-readable name of the discount.
          active:
            type: boolean
            description: 'Indicates whether the discount is available and can be

              applied by restaurant employees.

              '
          type:
            type: string
            description: '* `PERCENT` - the discount reduces the price by a

              preconfigured percent.

              * `FIXED` - the discount reduces the price by a

              preconfigured currency amount.

              * `OPEN_PERCENT` - the discount reduces the price by a

              percent entered by a restaurant employee.

              * `OPEN_FIXED` - the discount reduces the price by a

              currency amount entered by a restaurant employee.

              * `BOGO` - a buy one get one (BOGO) discount.

              * `FIXED_TOTAL` - a combo discount that reduces the

              price of all eligible items to a preconfigured currency

              amount.

              '
            enum:
            - PERCENT
            - FIXED
            - OPEN_PERCENT
            - OPEN_FIXED
            - BOGO
            - FIXED_TOTAL
          percentage:
            type: number
            format: double
            description: 'Percent discount applied when the `amountType` is

              `PERCENT`. This value will be greater than 0 and at

              most 100.

              '
          amount:
            type: number
            format: double
            description: 'The currency amount of the discount when the

              `amountType` is `FIXED`. This value will be greater

              than 0.

              '
          selectionType:
            type: string
            description: '* `CHECK` - the discount can be applied to a check.

              * `BOGO` - a buy one get one (BOGO) discount.

              * `ITEM` - the discount can be applied to an item

              selection in a check.

              '
            enum:
            - CHECK
            - ITEM
            - BOGO
          nonExclusive:
            type: boolean
            description: 'Indicates whether you can apply the discount with other

              discounts. This value is always `false` for item and

              combo discounts. Set this value for check and BOGO

              discounts by selecting **Allow with other discounts** in

              the **Discounts Rules** section of the discounts

              configuration page of Toast Web.

              '
          itemPickingPriority:
            type: string
            description: 'Indicates which menu item selections are discounted

              when you apply a BOGO discount. An item that is

              discounted by a BOGO discount is a "get" item.


              * `FIRST` - the BOGO discount applies to the first

              matching item selection in the check or the discount is

              not a BOGO discount.


              * `LEAST_EXPENSIVE` - the BOGO discount applies

              to the least expensive matching item selection in the check.

              `LEAST_EXPENSIVE` is the default `itemPickingPriority` value

              for discounts that are not BOGO discounts.


              * `MOST_EXPENSIVE` - the BOGO discount applies to the most

              expensive matching item selection in the check.

              '
            enum:
            - FIRST
            - LEAST_EXPENSIVE
            - MOST_EXPENSIVE
          fixedTotal:
            type: number
            format: double
            description: 'The total price of items discounted by a combo

              discount. This value is `null` for discounts that are

              not combo discounts.

              '
          promoCodes:
            type: array
            description: 'A list of promotion identifiers associated with this discount.

              '
            items:
              $ref: '#/components/schemas/PromoCode'
    PromoCode:
      type: object
      allOf:
      - $ref: '#/components/schemas/ToastReference'
      - type: object
        description: 'Information about a promotion, associated with a discount.

          '
        properties:
          code:
            type: string
            description: The identifier of the promotion. Guests enter the code to apply the discount.
          name:
            type: string
            description: The human-readable name of the promotion.
          usageType:
            type: string
            description: 'Indicates how the promo code can be used.

              * `SINGLE_USE_PHONE` - the promo code can only be used once per phone number. Some promotional
              discounts require a guest''s phone number when applying the promo code.

              * `SINGLE_USE_UNIQUE_CODE` - the promo code is a unique code that can only be used once.

              * `MULTI_USE` - the promo code can be used multiple times.

              '
            enum:
            - SINGLE_USE_PHONE
            - SINGLE_USE_UNIQUE_CODE
            - MULTI_USE
    Menu:
      type: object
      allOf:
      - $ref: '#/components/schemas/ExternalReference'
      - type: object
        properties:
          name:
            type: string
            description: 'The name of the menu as it appears in the Toast POS.

              '
          orderableOnline:
            type: string
            description: 'Deprecated. Indicates whether restaurant guests can order from the menu online.


              Use the `visibility` array that the menus API (V2) returns for each menu entity, instead
              of this

              `orderableOnline` value, to determine if the entity should be

              available for online ordering.

              '
            enum:
            - 'YES'
            - 'NO'
          visibility:
            type: string
            description: 'Deprecated. Indicates where the menu is displayed and who can see it.

              * ALL: Visible to everyone (servers and customers)

              * POS_ONLY: Only visible to servers

              * NONE: Hidden from everyone


              Use the `visibility` array that the menus API (V2) returns for each menu

              entity, instead of this `visibility` value, to determine where the

              entity should be visible.

              '
            enum:
            - ALL
            - POS_ONLY
            - NONE
          groups:
            type: array
            description: 'An array of the `MenuGroup` objects

              that are part of this menu.

              '
            minItems: 0
            items:
              $ref: '#/components/schemas/ExternalReference'
          images:
            type: array
            description: A collection of images associated with the menu.
            items:
              $ref: '#/components/schemas/Image'
          unitOfMeasure:
            type: string
            description: 'The unit of measure used to determine the price of items in this menu. For example,
              $10.00 per gram.


              The default is `NONE`, which means that the item is not meant to

              be measured during a sale.


              Values are:

              * `NONE` - The item is not meant to be measured.

              * `LB` - Weighed in pounds.

              * `OZ` - Weighed in ounces.

              * `KG` - Weighed in kilograms.

              * `G` - Weighed in grams.

              * `GAL` - Measured in gallons.

              * `L` - Measured in liters.

              * `ML` - Measured in milliliters.

              * `FL_OZ` - Measured in fluid ounces.

              * `M` - Measured in meters.

              * `CM` - Measured in centimeters.

              * `FT` - Measured in feet.

              * `IN` - Measured in inches.

              * `YD` - Measured in yards.

              '
            enum:
            - NONE
            - LB
            - OZ
            - KG
            - G
            - GAL
            - L
            - ML
            - FL_OZ
            - M
            - CM
            - FT
            - IN
            - YD
    MenuItem:
      type: object
      allOf:
      - $ref: '#/components/schemas/ExternalReference'
      - type: object
        properties:
          name:
            type: string
            description: 'The name of the menu item as it appears in the Toast POS.

              '
          calories:
            type: integer
            description: 'The amount of food energy in the item, expressed in

              Calorie units. Values can be positive, negative, or zero.

              '
          sku:
            type: string
            description: The stock keeping unit (SKU) code for the item.
          plu:
            type: string
            description: The price look up (PLU) code for the item.
          orderableOnline:
            type: string
            description: 'Deprecated. Indicates whether restaurant guests can order from the menu online.


              Use the `visibility` array that the menus API (V2) returns for each menu entity, instead
              of this

              `orderableOnline` value, to determine if the entity should be

              available for online ordering.

              '
            enum:
            - 'YES'
            - 'NO'
          visibility:
            type: string
            description: 'Deprecated. Indicates where the menu is displayed and who can see it.

              * ALL: Visible to everyone (servers and customers)

              * POS_ONLY: Only visible to servers

              * NONE: Hidden from everyone


              Use the `visibility` array that the menus API (V2) returns for each menu

              entity, instead of this `visibility` value, to determine where the

              entity should be visible.

              '
            enum:
            - ALL
            - POS_ONLY
            - NONE
          type:
            type: string
            description: 'Specifies whether this item is a special request or other

              off-menu transaction.

              * `NONE` - a normal menu item or modifier.

              * `OPEN_ITEM` - an item that is not on a menu.

              * `SPECIAL_REQUEST` - a selection that is not an item.

              * `PORTION` - a division of a menu item used to apply modifiers separately to separate parts
              of an item. For example, one half of a pizza.

              '
            enum:
            - NONE
            - OPEN_ITEM
            - SPECIAL_REQUEST
            - PORTION
          optionGroups:
            type: array
            description: 'An array of `ExternalReference` objects containing the

              identifiers of the `MenuOptionGroup`s

              that contain modifiers applicable to this item. Does not

              include those inherited from the parent `MenuGroup`.

              '
            minItems: 0
            items:
              $ref: '#/components/schemas/ExternalReference'
          inheritOptionGroups:
            type: boolean
            description: 'True if this menu item inherits `MenuOptionGroup`s

              from its parent `MenuGroup`.

              '
          images:
            type: array
            description: 'An array of `Image`

              objects that are associated with the `MenuItem`.

              '
            items:
              $ref: '#/components/schemas/Image'
          unitOfMeasure:
            type: string
            description: 'The unit of measure used to determine the price of the item.

              The default is NONE, which means that the item is not meant to

              be measured during a sale.

              This value is not relevant if `inheritUnitOfMeasure` is true.


              Values are:

              * `NONE` - The item is not meant to be measured.

              * `LB` - Weighed in pounds.

              * `OZ` - Weighed in ounces.

              * `KG` - Weighed in kilograms.

              * `G` - Weighed in grams.

              * `GAL` - Measured in gallons.

              * `L` - Measured in liters.

              * `ML` - Measured in milliliters.

              * `FL_OZ` - Measured in fluid ounces.

              * `M` - Measured in meters.

              * `CM` - Measured in centimeters.

              * `FT` - Measured in feet.

              * `IN` - Measured in inches.

              * `YD` - Measured in yards.

              '
            enum:
            - NONE
            - LB
            - OZ
            - KG
            - G
            - GAL
            - L
            - ML
            - FL_OZ
            - M
            - CM
            - FT
            - IN
            - YD
          inheritUnitOfMeasure:
            type: boolean
            description: 'True if this menu item inherits its unit of measure

              from its parent `MenuGroup`.

              '
    MenuGroup:
      type: object
      allOf:
      - $ref: '#/components/schemas/ExternalReference'
      - type: object
        properties:
          name:
            type: string
            description: The name of the menu group as it appears in the Toast POS.
          menu:
            $ref: '#/components/schemas/ExternalReference'
          orderableOnline:
            type: string
            description: 'Deprecated. Indicates whether restaurant guests can order from the menu online.


              Use the `visibility` array that the menus API (V2) returns for each menu entity, instead
              of this

              `orderableOnline` value, to determine if the entity should be

              available for online ordering.

              '
            enum:
            - 'YES'
            - 'NO'
          visibility:
            type: string
            description: 'Deprecated. Indicates where the menu is displayed and who can see it.

              * ALL: Visible to everyone (servers and customers)

              * POS_ONLY: Only visible to servers

              * NONE: Hidden from everyone


              Use the `visibility` array that the menus API (V2) returns for each menu

              entity, instead of this `visibility` value, to determine where the

              entity should be visible.

              '
            enum:
            - ALL
            - POS_ONLY
            - NONE
          parent:
            $ref: '#/components/schemas/ExternalReference'
          items:
