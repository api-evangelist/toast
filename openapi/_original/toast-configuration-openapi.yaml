            - SUFFIX
          parent:
            $ref: '#/components/schemas/ToastReference'
          chargeAsExtra:
            type: boolean
            description: 'When true, selecting this pre-modifier adds an additional portion of the modifier
              to the menu item and adds the price of the additional portion to the menu item according
              to the rules listed below.


              If the modifier group that the modifier belongs to:

              * Uses the **No charge** option, the Toast platform uses the modifier''s <a href="https://doc.toasttab.com/doc/platformguide/adminPricingModifierOptions.html#adminBasingModifierOptionsOnExistingMenuItems">override
              price</a> or, if no override price exists, the <a href="https://doc.toasttab.com/doc/platformguide/adminPricingModifierOptions.html#adminUnderstandingAModifierOptionsItemReference">item
              reference</a> price as the price of the additional portion.

              * Uses the **Individual** option where each modifier has its own price, the Toast platform
              uses the modifier''s override price or, if no override price exists, the item reference
              price as the price of the additional portion.

              * Uses the **Group** option where all modifiers in the group share a price, the Toast platform
              uses the group price as the price of the additional portion.


              Additionally, if the modifier group that the modifier belongs to uses:

              * <a href="https://doc.toasttab.com/doc/platformguide/adminSizePrice.html#adminSizePricingForModifierGroups">Size</a>
              pricing, the Toast platform uses the size price that matches the size of the menu item when
              determining the price of the additional portion.

              * <a href="https://doc.toasttab.com/doc/platformguide/adminSequencePrice.html">Sequence</a>
              pricing, the Toast platform treats the additional portion as the next modifier in the sequence
              and prices it using the sequence pricing rules that have been specified.

              * <a href="https://doc.toasttab.com/doc/platformguide/adminSizeSequencePrice.html">Size/sequence</a>
              pricing, the Toast platform matches the size of the additional portion to the size of the
              menu item and then treats it as the next modifier in the sequence when determining the price
              of the additional portion.


              The `chargeAsExtra` value is `null` if the value is not set.

              '
            nullable: true
    PreModifierGroup:
      type: object
      allOf:
      - $ref: '#/components/schemas/ToastReference'
      - type: object
        properties:
          name:
            type: string
            description: The name of the pre modifier that appears in the Toast POS.
          isDefault:
            type: boolean
            description: 'True if this PreModifierGroup is set as the default Group.

              Only a single PreModifierGroup can be set as default at one time.

              '
    NoSaleReason:
      type: object
      allOf:
      - $ref: '#/components/schemas/ToastReference'
      - type: object
        properties:
          name:
            type: string
            description: The name of the no sale reason that appears in the Toast POS.
    PayoutReason:
      type: object
      allOf:
      - $ref: '#/components/schemas/ToastReference'
      - type: object
        properties:
          name:
            type: string
            description: The short name of this payout reason.
    PriceGroup:
      type: object
      allOf:
      - $ref: '#/components/schemas/ToastReference'
      - type: object
        properties:
          name:
            type: string
            description: The name of this price group.
    Printer:
      type: object
      allOf:
      - $ref: '#/components/schemas/ToastReference'
      - type: object
        properties:
          name:
            type: string
            description: The name of this printer.
    RestaurantService:
      type: object
      allOf:
      - $ref: '#/components/schemas/ToastReference'
      - type: object
        properties:
          name:
            type: string
            description: 'The name of this meal service (for example, `Lunch` or

              `Dinner`).

              '
    RevenueCenter:
      type: object
      allOf:
      - $ref: '#/components/schemas/ToastReference'
      - type: object
        description: A set of ServiceAreas and POS devices for which separate revenue reports can be generated.
          For instance, a restaurant with a bar might choose to define two RevenueCenters, one for the
          bar and one for the dining area.
        properties:
          name:
            type: string
            description: The name of this revenue center.
          description:
            type: string
            description: The description of this revenue center.
    SalesCategory:
      type: object
      allOf:
      - $ref: '#/components/schemas/ToastReference'
      - type: object
        description: A set of items that will be grouped together in sales reports. SalesCategories can
          be applied at any level, from entire menus to individual menu items.
        properties:
          name:
            type: string
            description: The name of this sales category.
    ServiceArea:
      type: object
      allOf:
      - $ref: '#/components/schemas/ToastReference'
      - type: object
        description: A representation of a physical service area, a group of tables, in a restaurant.
        properties:
          name:
            type: string
            description: The name of this service area.
          revenueCenter:
            $ref: '#/components/schemas/ExternalReference'
    ServiceCharge:
      type: object
      allOf:
      - $ref: '#/components/schemas/ExternalReference'
      - type: object
        description: Any charge applied to a check for something other than menu item. Typical examples
          include gratuity and delivery fees.
        properties:
          name:
            type: string
            description: The name of this service charge.
          amountType:
            type: string
            description: The type of service charge.
            enum:
            - FIXED
            - PERCENT
            - OPEN
          amount:
            type: number
            format: double
            description: Amount in USD to be applied for `FIXED` type service charges.
          percent:
            type: number
            format: double
            description: 'Percent fee to be applied for `PERCENT` type service

              charges, based on pre-discount check amount. Must be a

              number between 0 and 100.

              '
          criteria:
            $ref: '#/components/schemas/ServiceChargeCriteria'
          gratuity:
            type: boolean
            description: True if the service charge is a gratuity and is assigned to the owner of the
              check.
          taxable:
            type: boolean
            description: True if tax should be applied to the service charge.
          applicableTaxes:
            type: array
            description: A reference to the taxes applied to the service charge, if the service charge
              is taxable.
            items:
              $ref: '#/components/schemas/TaxRate'
          serviceChargeCalculation:
            type: string
            description: Defines whether or not the service charge is applied before (PRE) or after (POST)
              discounts. This field is null for non-percent service charges.
            enum:
            - PRE_DISCOUNT
            - POST_DISCOUNT
          destination:
            type: string
            description: 'Final recipient of the funds from this service charge.


              * `RESTAURANT` - The business owner of the restaurant receives the service charge funds.

              * `SERVER` - Restaurant employees receive the service charge funds e.g. gratuity.

              * `TOAST` - Toast receives the service charge funds.

              * `THIRD_PARTY` - A third party receives the service charge funds e.g. fundraising funds
              go to charity.

              '
            enum:
            - RESTAURANT
            - SERVER
            - TOAST
            - THIRD_PARTY
          taxInclusive:
            type: boolean
            description: Supports future functionality.
          taxProrated:
            type: boolean
            description: Supports future functionality.
    ServiceChargeCriteria:
      description: Describes thresholds for when a service charge should be applied to a check.
      properties:
        minCheckAmount:
          type: number
          format: double
          description: The service charge is only applicable if the pre-discount check is at least this
            amount.
        delivery:
          type: boolean
          description: True if the service charge is only applicable for deliveries.
        maxCheckAmount:
          type: number
          format: double
          description: The service charge is waived if the pre-discount check amount is more than this
            amount. A `null` value means this criteria is inapplicable.
        minDeliveryDistance:
          type: number
          format: double
          description: The service charge is only applicable to deliveries that are at least this distance.
            A `null` value means this criteria is inapplicable.
        takeout:
          type: boolean
          description: Indicates whether the service charge is automatically applied to orders that have
            the takeout dining option behavior.
        dineIn:
          type: boolean
          description: Indicates whether the service charge is applied to orders that have the dine-in
            dining option behavior.
    Table:
      type: object
      allOf:
      - $ref: '#/components/schemas/ToastReference'
      - type: object
        description: Represents a dining table in a restaurant.
        properties:
          name:
            type: string
            description: The human-readable name of this table as it appears in the POS.
          serviceArea:
            $ref: '#/components/schemas/ToastReference'
          revenueCenter:
            $ref: '#/components/schemas/ExternalReference'
    TaxRate:
      type: object
      allOf:
      - $ref: '#/components/schemas/ToastReference'
      - type: object
        properties:
          name:
            type: string
            description: The name of this tax rate.
          isDefault:
            type: boolean
            description: True if this tax rate is the default tax rate.
          rate:
            type: number
            format: double
            description: 'The tax rate value.


              For a fixed amount tax rate, is the fixed amount of the tax.


              For a percent tax rate, the percentage is expressed as a decimal value. For example, if
              the tax rate is 6.25%, then `rate` is 0.0625.


              If `type` is `NONE`, then `rate` is `null`.

              '
          type:
            type: string
            description: The type of the tax rate.
            enum:
            - PERCENT
            - FIXED
            - TABLE
            - NONE
            - EXTERNAL
          roundingType:
            type: string
            description: 'The method used to round fractional currency amounts to non-fractional currency
              amounts.


              Only applies to `PERCENT` tax rates. For other tax rate types, `roundingType` is `null`.


              Valid values:


              * `HALF_UP` - Round values up or down to the nearest number. If the last digit is 5, which
              is halfway, then always round up to the nearest number.


              * `HALF_EVEN` - Round values up or down to the nearest number. If the last digit is 5, which
              is halfway, then round up or down to the nearest even number.


              * `ALWAYS_UP` - Always round up to the next number.


              * `ALWAYS_DOWN` - Always round down to the next number.


              For more details and examples, see <a href="https://doc.toasttab.com/doc/platformguide/adminPercentTaxRates.html#roundingOptions">Rounding
              options</a>.

              '
            enum:
            - HALF_UP
            - HALF_EVEN
            - ALWAYS_UP
            - ALWAYS_DOWN
          taxTable:
            type: array
            description: An array of `TaxTableRow` objects that define a set of tax amounts that apply
              to specific sale amount ranges.
            items:
              $ref: '#/components/schemas/TaxTableRow'
          conditionalTaxRates:
            type: array
            description: 'An array of `ConditionalTaxRate`

              objects that indicate the conditional rates that override

              the default `rate` for this `TaxRate` in specific

              situations. For example, a conditional rate might

              override the default rate when a `TaxRate` is applied for

              a specific dining option, such as takeout.

              '
            items:
              $ref: '#/components/schemas/ConditionalTaxRate'
    ConditionalTaxRate:
      type: object
      description: 'A conditional tax rate that overrides the default `rate`

        for a `TaxRate` in

        specific situations. For example, a conditional rate

        might override the default rate when a `TaxRate` is

        applied for a specific dining option, such as takeout.

        '
      properties:
        condition:
          description: A string describing the condition for the tax rate
          type: string
        rate:
          description: The percentage rate of the conditional tax rate
          type: number
          format: double
    TaxTableRow:
      type: object
      description: A closed sale amount range that corresponds to a specific tax amount in a tax table.
      properties:
        start:
          description: The start of a sale amount range that corresponds to a specific tax amount in a
            tax table.
          type: number
          format: currency
        end:
          description: The end of a sale amount range that corresponds to a specific tax amount in a tax
            table.
          type: number
          format: currency
        tax:
          description: The tax amount for the tax table row.
          type: number
          format: currency
        pattern:
          description: Specifies whether the price range is part of an incomplete set of ranges that establish
            an algorithm that you can use to calculate tax amounts.
          type: boolean
    TipWithholding:
      type: object
      description: 'Information about the way tip withholding is configured for

        a restaurant. Tip withholding is a percentage of employees''

        credit card tips and service charges that are paid to

        employees as a gratuity that is kept by a restaurant to

        cover credit card processing fees.

        '
      allOf:
      - $ref: '#/components/schemas/ToastReference'
      - type: object
        properties:
          enabled:
            type: boolean
            description: 'Indicates whether a restaurant location withholds a percent of

              employees'' credit card tips.


              * `true` - the location keeps a percent of employees'' credit card

              tips.


              * `false` - the location does not keep a percent of employees''

              credit card tips.

              '
          percentage:
            type: number
            description: 'The decimal percentage of credit card tips withheld. If tip

              withholding is not `enabled`, tips will not be withheld in the

              Toast platform regardless of this value.

              '
    VoidReason:
      type: object
      allOf:
      - $ref: '#/components/schemas/ToastReference'
      - type: object
        description: When voiding something through the POS, the user must choose a preconfigured void
          reason.
        properties:
          name:
            type: string
            description: The name of this void reason.
    Image:
      type: object
      description: Information about an image associated with a menu or menu item.
      properties:
        url:
          description: The web address of the image.
          type: string
    ExternalReference:
      type: object
      allOf:
      - $ref: '#/components/schemas/ToastReference'
      - type: object
        properties:
          externalId:
            description: External identifier string, prefixed by the naming authority.
            type: string
        description: A wrapper object with fields that allow reference to a Toast entity by Toast GUID
          or a partner's identifier.
    ToastReference:
      type: object
      description: A wrapper object with fields that allow reference to a Toast entity by Toast GUID.
      required:
      - guid
      - entityType
      properties:
        guid:
          description: The GUID maintained by the Toast POS.
          type: string
        entityType:
          description: The type of object this is.
          type: string
