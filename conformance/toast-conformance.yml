method: derived
source: openapi/*.yaml + openapi/*.yml in this repo; enriched from the Toast developer guide
docs:
- https://doc.toasttab.com/doc/devguide/authentication.html
- https://doc.toasttab.com/doc/devguide/apiScopes.html
