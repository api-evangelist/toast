naftiko: "1.0.0-alpha2"

info:
  label: "Partners API — General"
  description: >-
    General — 2 operations. Lead operation: Toast Get Accessible Restaurants.
    Self-contained Naftiko capability covering one Toast business surface.
  tags:
    - Toast
    - Partners
  created: "2026-06-03"
  modified: "2026-06-03"

binds:
  - namespace: env
    keys:
      TOAST_ACCESS_TOKEN: TOAST_ACCESS_TOKEN

capability:

  consumes:
    - type: http
      namespace: "partners-general"
      baseUri: "https://ws-api.toasttab.com/partners/v1"
      description: "Partners API — General business capability. Self-contained, no shared references."
      authentication:
        type: bearer
        token: "{{env.TOAST_ACCESS_TOKEN}}"
      resources:
        - name: "restaurants"
          path: "/restaurants"
          operations:
            - name: "restaurantsGet"
              method: GET
              description: "Toast Get Accessible Restaurants"
              inputParameters:
                - name: "lastModified"
                  in: query
                  type: string
                  required: false
                  description: "Limits the return data to restaurants that changed their"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: "connectedrestaurants"
          path: "/connectedRestaurants"
          operations:
            - name: "connectedRestaurantsGet"
              method: GET
              description: "Toast Get Connected Restaurants"
              inputParameters:
                - name: "lastModified"
                  in: query
                  type: string
                  required: false
                  description: "Limits the return data to restaurants that changed their access"
                - name: "pageSize"
                  in: query
                  type: string
                  required: false
                  description: "Controls the number of `PartnerAccessExternalRep` objects that the"
                - name: "pageToken"
                  in: query
                  type: string
                  required: false
                  description: "Returns a specific set of restaurants in the response value. You get"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      namespace: "partners-general-rest"
      port: 8080
      description: "REST adapter for Partners API — General. One Spectral-compliant resource per consumed operation, prefixed with /v1."
      resources:
        - path: "/v1/restaurants"
          name: "restaurants"
          description: "REST surface for restaurants."
          operations:
            - method: GET
              name: "restaurantsGet"
              description: "Toast Get Accessible Restaurants"
              call: "partners-general.restaurantsGet"
              with:
                "lastModified": "rest.lastModified"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: "/v1/connectedrestaurants"
          name: "connectedrestaurants"
          description: "REST surface for connectedrestaurants."
          operations:
            - method: GET
              name: "connectedRestaurantsGet"
              description: "Toast Get Connected Restaurants"
              call: "partners-general.connectedRestaurantsGet"
              with:
                "lastModified": "rest.lastModified"
                "pageSize": "rest.pageSize"
                "pageToken": "rest.pageToken"
              outputParameters:
                - type: object
                  mapping: "$."
    - type: mcp
      namespace: "partners-general-mcp"
      port: 9090
      transport: http
      description: "MCP adapter for Partners API — General. One tool per consumed operation, routed inline through this capability consumes block."
      tools:
        - name: "get-accessible-restaurants"
          description: "Toast Get Accessible Restaurants"
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: "partners-general.restaurantsGet"
          with:
            "lastModified": "tools.lastModified"
          outputParameters:
            - type: object
              mapping: "$."
        - name: "get-connected-restaurants"
          description: "Toast Get Connected Restaurants"
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: "partners-general.connectedRestaurantsGet"
          with:
            "lastModified": "tools.lastModified"
            "pageSize": "tools.pageSize"
            "pageToken": "tools.pageToken"
          outputParameters:
            - type: object
              mapping: "$."

