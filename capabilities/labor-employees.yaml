naftiko: "1.0.0-alpha2"

info:
  label: "Toast Labor API — Employees"
  description: >-
    Employees — 10 operations. Lead operation: Toast Get Employees.
    Self-contained Naftiko capability covering one Toast business surface.
  tags:
