        description: Toast Get Jobs
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: Toast-Restaurant-External-ID
          in: header
          type: string
          description: 'The Toast platform GUID of the restaurant that is the '
          required: true
