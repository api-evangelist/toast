              name: "shiftsShiftIdDelete"
              description: "Toast Delete a Shift"
              call: "labor-shifts.shiftsShiftIdDelete"
              with:
                "Toast-Restaurant-External-ID": "rest.Toast-Restaurant-External-ID"
                "shiftId": "rest.shiftId"
              outputParameters:
