            destructive: false
            idempotent: false
          call: "labor-shifts.shiftsPost"
          with:
            "Toast-Restaurant-External-ID": "tools.Toast-Restaurant-External-ID"
            "Content-Type": "tools.Content-Type"
            "body": "tools.body"
          outputParameters:
            - type: object
              mapping: "$."
        - name: "get-shift"
          description: "Toast Get a Shift"
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: "labor-shifts.shiftsShiftIdGet"
          with:
            "Toast-Restaurant-External-ID": "tools.Toast-Restaurant-External-ID"
            "shiftId": "tools.shiftId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: "update-shift"
          description: "Toast Update a Shift"
          hints:
            readOnly: false
            destructive: false
            idempotent: true
          call: "labor-shifts.shiftsShiftIdPut"
          with:
            "Toast-Restaurant-External-ID": "tools.Toast-Restaurant-External-ID"
            "shiftId": "tools.shiftId"
            "body": "tools.body"
          outputParameters:
            - type: object
              mapping: "$."
        - name: "delete-shift"
          description: "Toast Delete a Shift"
          hints:
            readOnly: false
            destructive: true
            idempotent: true
          call: "labor-shifts.shiftsShiftIdDelete"
          with:
            "Toast-Restaurant-External-ID": "tools.Toast-Restaurant-External-ID"
            "shiftId": "tools.shiftId"
          outputParameters:
