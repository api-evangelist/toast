          name: "shifts-shiftid"
          description: "REST surface for shifts-shiftid."
          operations:
            - method: PUT
              name: "shiftsShiftIdPut"
              description: "Toast Update a Shift"
              call: "labor-shifts.shiftsShiftIdPut"
