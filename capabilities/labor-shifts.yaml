          operations:
            - method: GET
              name: "shiftsShiftIdGet"
              description: "Toast Get a Shift"
              call: "labor-shifts.shiftsShiftIdGet"
              with:
                "Toast-Restaurant-External-ID": "rest.Toast-Restaurant-External-ID"
                "shiftId": "rest.shiftId"
              outputParameters:
