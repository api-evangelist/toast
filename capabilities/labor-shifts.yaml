                  mapping: "$."
    - type: mcp
      namespace: "labor-shifts-mcp"
      port: 9090
      transport: http
      description: "MCP adapter for Toast Labor API — Shifts. One tool per consumed operation, routed inline through this capability consumes block."
      tools:
        - name: "get-shifts"
          description: "Toast Get Shifts"
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: "labor-shifts.shiftsGet"
          with:
            "Toast-Restaurant-External-ID": "tools.Toast-Restaurant-External-ID"
            "shiftIds": "tools.shiftIds"
            "startDate": "tools.startDate"
            "endDate": "tools.endDate"
          outputParameters:
