naftiko: "1.0.0-alpha2"

info:
  label: "Toast Labor API — Shifts"
  description: >-
    Shifts — 5 operations. Lead operation: Toast Get Shifts.
    Self-contained Naftiko capability covering one Toast business surface.
  tags:
    - Toast
    - Labor
    - Shifts
  created: "2026-06-03"
  modified: "2026-06-03"

binds:
  - namespace: env
    keys:
      TOAST_ACCESS_TOKEN: TOAST_ACCESS_TOKEN

capability:

