naftiko: 1.0.0-alpha2
info:
  label: Menus API
  description: 'Menus API. 2 operations. Lead operation: Toast Get Menus. Self-contained Naftiko capability covering one Toast
    business surface.'
  tags:
  - Toast
  - Menus API
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TOAST_API_KEY: TOAST_API_KEY
capability:
  consumes:
  - type: http
    namespace: menus
    baseUri: https://toast-api-server/menus/v2
    description: Menus API business capability. Self-contained, no shared references.
    resources:
    - name: menus
      path: /menus
      operations:
      - name: menusget
        method: GET
        description: Toast Get Menus
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: Toast-Restaurant-External-ID
          in: header
          type: string
          description: The identifier for the restaurant.
          required: true
    - name: metadata
      path: /metadata
      operations:
      - name: metadataget
        method: GET
        description: Toast Get Menu Last Modified Timestamp
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: Toast-Restaurant-External-ID
          in: header
          type: string
          description: The identifier for the restaurant.
          required: true
  exposes:
  - type: rest
    namespace: menus-rest
    port: 8080
    description: REST adapter for Menus API. One Spectral-compliant resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/menus
      name: menus
      description: REST surface for menus.
      operations:
      - method: GET
        name: menusget
        description: Toast Get Menus
        call: menus.menusget
        with:
          Toast-Restaurant-External-ID: rest.Toast-Restaurant-External-ID
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/metadata
      name: metadata
      description: REST surface for metadata.
      operations:
      - method: GET
        name: metadataget
        description: Toast Get Menu Last Modified Timestamp
        call: menus.metadataget
        with:
          Toast-Restaurant-External-ID: rest.Toast-Restaurant-External-ID
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: menus-mcp
    port: 9090
    transport: http
    description: MCP adapter for Menus API. One tool per consumed operation, routed inline through this capability's consumes
      block.
    tools:
    - name: toast-get-menus
      description: Toast Get Menus
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: menus.menusget
      with:
        Toast-Restaurant-External-ID: tools.Toast-Restaurant-External-ID
      outputParameters:
      - type: object
        mapping: $.
    - name: toast-get-menu-last-modified
      description: Toast Get Menu Last Modified Timestamp
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: menus.metadataget
      with:
        Toast-Restaurant-External-ID: tools.Toast-Restaurant-External-ID
      outputParameters:
      - type: object
        mapping: $.
