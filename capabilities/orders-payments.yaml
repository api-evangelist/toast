naftiko: "1.0.0-alpha2"

info:
  label: "Toast Orders API — Payments"
  description: >-
    Payments — 4 operations. Lead operation: Toast Get Payment Identifiers.
    Self-contained Naftiko capability covering one Toast business surface.
  tags:
    - Toast
    - Orders
    - Payments
  created: "2026-06-03"
  modified: "2026-06-03"

binds:
  - namespace: env
    keys:
      TOAST_ACCESS_TOKEN: TOAST_ACCESS_TOKEN

capability:

  consumes:
    - type: http
      namespace: "orders-payments"
      baseUri: "https://ws-api.toasttab.com/orders/v2"
      description: "Toast Orders API — Payments business capability. Self-contained, no shared references."
      authentication:
        type: bearer
        token: "{{env.TOAST_ACCESS_TOKEN}}"
      resources:
        - name: "payments"
          path: "/payments"
          operations:
            - name: "paymentsGet"
              method: GET
              description: "Toast Get Payment Identifiers"
              inputParameters:
                - name: "Toast-Restaurant-External-ID"
                  in: header
                  type: string
                  required: true
                  description: "The GUID of the restaurant used as the context of the request."
                - name: "paidBusinessDate"
                  in: query
                  type: string
                  required: false
                  description: "Returns a list of the payments that were made during"
                - name: "refundBusinessDate"
                  in: query
                  type: string
                  required: false
                  description: "Returns a list of the payments that were refunded"
                - name: "voidBusinessDate"
                  in: query
                  type: string
                  required: false
                  description: "Returns a list of the payments that were voided during"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: "payments-guid"
          path: "/payments/{guid}"
          operations:
            - name: "paymentsGuidGet"
              method: GET
              description: "Toast Get a Payment"
              inputParameters:
                - name: "Toast-Restaurant-External-ID"
                  in: header
                  type: string
                  required: true
                  description: "The GUID of the restaurant used as the context of the request."
                - name: "guid"
                  in: path
                  type: string
                  required: true
                  description: "The GUID for the payment you want to return."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: "orders-orderguid-checks-checkguid-payments"
          path: "/orders/{orderGuid}/checks/{checkGuid}/payments"
          operations:
            - name: "ordersChecksPaymentsPost"
              method: POST
              description: "Toast Post Payments"
              inputParameters:
                - name: "orderGuid"
                  in: path
                  type: string
                  required: true
                  description: "The Toast platform identifier of the order that you are"
                - name: "checkGuid"
                  in: path
                  type: string
                  required: true
                  description: "The Toast platform identifier of the check that you are"
                - name: "body"
                  in: body
                  type: array
                  required: true
                  description: "An array of JSON `Payment` objects containing information about the payments you are adding."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: "orders-orderguid-checks-checkguid-payments-paymentguid"
          path: "/orders/{orderGuid}/checks/{checkGuid}/payments/{paymentGuid}"
          operations:
            - name: "ordersOrderGuidChecksCheckGuidPaymentsPaymentGuidPatch"
              method: PATCH
              description: "Toast Update a Tip Amount"
              inputParameters:
                - name: "orderGuid"
                  in: path
                  type: string
                  required: true
                  description: "The Toast platform identifier of the order that you are"
                - name: "checkGuid"
                  in: path
                  type: string
                  required: true
                  description: "The Toast platform identifier of the check that you are"
                - name: "paymentGuid"
                  in: path
                  type: string
                  required: true
                  description: "The Toast platform identifier of the payment that you are"
                - name: "body"
                  in: body
                  type: string
                  required: true
                  description: "A JSON `Payment` object"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      namespace: "orders-payments-rest"
      port: 8080
      description: "REST adapter for Toast Orders API — Payments. One Spectral-compliant resource per consumed operation, prefixed with /v1."
      resources:
        - path: "/v1/payments"
          name: "payments"
          description: "REST surface for payments."
          operations:
            - method: GET
              name: "paymentsGet"
              description: "Toast Get Payment Identifiers"
              call: "orders-payments.paymentsGet"
              with:
                "Toast-Restaurant-External-ID": "rest.Toast-Restaurant-External-ID"
                "paidBusinessDate": "rest.paidBusinessDate"
                "refundBusinessDate": "rest.refundBusinessDate"
                "voidBusinessDate": "rest.voidBusinessDate"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: "/v1/payments-guid"
          name: "payments-guid"
          description: "REST surface for payments-guid."
          operations:
            - method: GET
              name: "paymentsGuidGet"
              description: "Toast Get a Payment"
              call: "orders-payments.paymentsGuidGet"
              with:
                "Toast-Restaurant-External-ID": "rest.Toast-Restaurant-External-ID"
                "guid": "rest.guid"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: "/v1/orders-orderguid-checks-checkguid-payments"
          name: "orders-orderguid-checks-checkguid-payments"
          description: "REST surface for orders-orderguid-checks-checkguid-payments."
          operations:
            - method: POST
              name: "ordersChecksPaymentsPost"
              description: "Toast Post Payments"
              call: "orders-payments.ordersChecksPaymentsPost"
              with:
                "orderGuid": "rest.orderGuid"
                "checkGuid": "rest.checkGuid"
                "body": "rest.body"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: "/v1/orders-orderguid-checks-checkguid-payments-paymentguid"
          name: "orders-orderguid-checks-checkguid-payments-paymentguid"
          description: "REST surface for orders-orderguid-checks-checkguid-payments-paymentguid."
          operations:
            - method: PATCH
              name: "ordersOrderGuidChecksCheckGuidPaymentsPaymentGuidPatch"
              description: "Toast Update a Tip Amount"
              call: "orders-payments.ordersOrderGuidChecksCheckGuidPaymentsPaymentGuidPatch"
              with:
                "orderGuid": "rest.orderGuid"
                "checkGuid": "rest.checkGuid"
                "paymentGuid": "rest.paymentGuid"
                "body": "rest.body"
              outputParameters:
                - type: object
                  mapping: "$."
    - type: mcp
      namespace: "orders-payments-mcp"
      port: 9090
      transport: http
      description: "MCP adapter for Toast Orders API — Payments. One tool per consumed operation, routed inline through this capability consumes block."
      tools:
        - name: "get-payment-identifiers"
          description: "Toast Get Payment Identifiers"
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: "orders-payments.paymentsGet"
          with:
            "Toast-Restaurant-External-ID": "tools.Toast-Restaurant-External-ID"
            "paidBusinessDate": "tools.paidBusinessDate"
            "refundBusinessDate": "tools.refundBusinessDate"
            "voidBusinessDate": "tools.voidBusinessDate"
          outputParameters:
            - type: object
              mapping: "$."
        - name: "get-payment"
          description: "Toast Get a Payment"
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: "orders-payments.paymentsGuidGet"
          with:
            "Toast-Restaurant-External-ID": "tools.Toast-Restaurant-External-ID"
            "guid": "tools.guid"
          outputParameters:
            - type: object
              mapping: "$."
        - name: "post-payments"
          description: "Toast Post Payments"
          hints:
            readOnly: false
            destructive: false
            idempotent: false
          call: "orders-payments.ordersChecksPaymentsPost"
          with:
            "orderGuid": "tools.orderGuid"
            "checkGuid": "tools.checkGuid"
            "body": "tools.body"
          outputParameters:
            - type: object
              mapping: "$."
        - name: "update-tip-amount"
          description: "Toast Update a Tip Amount"
          hints:
            readOnly: false
            destructive: false
            idempotent: true
          call: "orders-payments.ordersOrderGuidChecksCheckGuidPaymentsPaymentGuidPatch"
          with:
            "orderGuid": "tools.orderGuid"
            "checkGuid": "tools.checkGuid"
            "paymentGuid": "tools.paymentGuid"
            "body": "tools.body"
          outputParameters:
            - type: object
              mapping: "$."

