provider: Toast
providerId: toast
summary: Toast publishes a reference of the decline messages a Toast POS terminal displays when a card
  payment is refused. Toast states explicitly that these messages and descriptions are produced by the
  CARD PROCESSOR, not by Toast, and are subject to change by the card network without notice - so they
  are a display vocabulary a partner should recognise, not a stable Toast API enum. They are the surface
  a guest and a server actually see; the Toast credit cards API returns its own ErrorMessage envelope
  (see errors/toast-problem-types.yml) rather than these strings.
envelope_field: Toast POS decline message (terminal display string)
api_surface: PUT /ccpartner/v1/merchants/{merchantUuid}/payments/{paymentUuid} - the credit cards API
  authorization operation - returns 400/404/409/422/500 with a Toast ErrorMessage. The decline strings
  below are the processor-originated messages shown on the terminal, not values of the API error code.
masked_to_buyer: Toast does not publish a mapping of which decline reasons are masked from the guest.
  The messages below are what the POS shows to the restaurant operator.
decline_code_count: 28
