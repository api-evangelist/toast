summary: >-
  No /.well-known document is served on any Toast host. pos.toasttab.com and developers.toasttab.com sit
  behind a Cloudflare interstitial that answers 403 "Just a moment..." to every path including
  /.well-known/*, so those rows record the challenge rather than a document; www.toasttab.com answers a
  real 404 HTML page for every path; doc.toasttab.com is an S3-backed origin that answers 403
  AccessDenied for absent keys; ws-api.toasttab.com (the live Toast API gateway) answers its own JSON
  404 envelope. No path on any host returned a document, so NO WellKnown or SecurityTxt pointer is
  emitted in apis.yml. This file records the absence, it does not assert a presence.
