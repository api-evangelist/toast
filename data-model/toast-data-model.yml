provider: Toast
providerId: toast
schema_count: 218
summary: >-
  Toast's object graph hangs off ONE root - the Restaurant, addressed by GUID and carried on nearly
  every request in the Toast-Restaurant-External-ID header. Below it sit three mostly-separate
  sub-graphs that meet only at the Order: the MENU catalog (Menu -> MenuGroup -> MenuItem ->
  ModifierGroup -> ModifierOption), the ORDER lifecycle (Order -> Check -> Selection -> Payment /
  AppliedDiscount), and the LABOR domain (Employee -> Job / Shift / TimeEntry -> TimeEntryBreak). The
  configuration API is a flat lookup layer of 24 reference collections (dining options, tax rates,
  revenue centers, service areas, tables, printers, cash drawers, void reasons) that the order and
  menu graphs reference by GUID.
identifiers:
  primary_key: GUID (UUID v4 string)
  cross_location_key: multiLocationId
  cross_location_note: >-
    Menu entities carry BOTH a per-location `guid` and a `multiLocationId` that is stable for the same
    logical item across every location in a restaurant group, plus a `masterId`. This is the single
    most confusing thing in the Toast model for an integrator and Toast documents it separately.
  external_binding: >-
    Labor entities accept a partner-owned externalId written through
    POST/PUT /labor/v1/employees/{id}/externalId and /labor/v1/jobs/{id}/externalId. Menu and order
    entities expose an ExternalReference / ToastReference wrapper instead.
  id_prefixes: none - Toast GUIDs carry no type prefix, so an identifier alone does not tell you what
    it points at.
