reporting_projection:
  spec: openapi/toast-analytics-openapi.yaml
  note: >-
    The analytics API is a denormalised REPORTING projection of the same core, not another view of the
    entity graph - LaborReportingData, MenuReportingData, MetricsReportingData, CheckReportingData,
    PayoutPaymentsReportingData, PayoutSettledDateReportingData, PayoutSalesDateReportingData and
    GuestPaymentsReportingData are flat row shapes with 11-24 columns each and no $ref edges. It
    operates on a management group, and uses a two-step async pattern (POST returns a
    reportRequestGuid, GET retrieves the rows).
