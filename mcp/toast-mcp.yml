- name: toast_get_inventory
  description: Read menu item and modifier stock availability.
  rest: getInventory
  spec: openapi/toast-stock-api-openapi.yml
  scope: stock:read
  consequence: read
- name: toast_update_inventory
  description: Update stock status and quantity for menu items and modifier options.
  rest: updateInventory
  spec: openapi/toast-stock-api-openapi.yml
  scope: stock:write
  consequence: write
- name: toast_list_employees
  description: List employees at a location.
  rest: employeesGet
  spec: openapi/toast-employees-api-openapi.yml
  scope: labor.employees:read
  consequence: read
- name: toast_get_time_entries
  description: Retrieve employee time entries and breaks.
  rest: timeEntriesGet
  spec: openapi/toast-time-entries-api-openapi.yml
  scope: labor:read
  consequence: read
- name: toast_request_analytics_report
  description: Request and retrieve aggregated sales, check, labor, menu, payout or guest reporting
    data for a management group.
  rest: postMetricsReportingDataCustomTimeRangeRequest, getMetricsReportingData,
    postCheckReportingDataSpecificTimeRangeRequest, getCheckReportingData
  spec: openapi/toast-analytics-openapi.yaml
  consequence: read
  note: Two-step async pattern - POST returns a reportRequestGuid, GET retrieves the result.
