aid: toast
name: Toast
description: Toast is a restaurant technology platform providing cloud-based point-of-sale, payment processing,
  and business management tools for the restaurant industry. The Toast platform exposes REST APIs enabling technology
  partners to build integrations for orders, menus, labor management, restaurant configuration, inventory/stock
  management, authentication, and partner ecosystem access. APIs use OAuth 2.0 client credentials authentication
  with GUIDs for resource identification. Toast serves 120,000+ restaurant locations and offers both partner integrations
  (requiring formal partnership) and custom integrations via the developer portal.
