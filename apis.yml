- type: Features
  data:
  - name: Orders API
    description: Retrieve restaurant orders, checks, and payment data by GUID or bulk
      date queries.
  - name: Menus API
    description: Full menu data retrieval including items, modifiers, prices, and
      availability.
  - name: Labor Management API
    description: Employee CRUD operations, shift management, and payroll integration
      support.
  - name: Restaurant Configuration API
    description: Location settings, payment options, and management group restaurant
      discovery.
  - name: Stock and Inventory API
    description: Inventory management for menu items and modifiers with stock level
      tracking.
  - name: OAuth 2.0 Authentication
    description: Client credentials OAuth flow with GUID-scoped tokens for secure
      API access.
  - name: Partner Integration Program
    description: Formal partner program enabling multi-restaurant access and ecosystem
      integrations.
  - name: Webhook Support
    description: Outbound integration webhooks for real-time event delivery (gift
      cards, loyalty, tender).
- type: UseCases
  data:
  - name: Online Ordering Integration
    description: Connect third-party online ordering platforms to Toast POS for order
      injection and menu sync.
  - name: Payroll and Labor Integration
    description: Sync Toast employee and shift data with payroll systems using the
      Labor API.
  - name: Reporting and Analytics
    description: Pull order and payment data via bulk orders API for custom reporting
      and business intelligence.
  - name: Inventory Management
    description: Integrate restaurant inventory systems with Toast Stock API for real-time
      stock tracking.
  - name: Loyalty and Gift Cards
    description: Build loyalty program and gift card integrations using Toast outbound
      webhook APIs.
  - name: Multi-Location Management
    description: Partner integrations managing hundreds of restaurant locations via
      Partners API.
- type: Integrations
  data:
  - name: DoorDash
    description: Third-party delivery platform integrated with Toast for order injection.
  - name: UberEats
    description: Delivery platform integration for menu sync and order management.
  - name: QuickBooks
    description: Accounting integration for restaurant financial data via Toast reporting
      APIs.
  - name: ADP
    description: Payroll platform integration using Toast Labor API data.
  - name: OpenTable
    description: Reservation system integration with Toast for guest management.
